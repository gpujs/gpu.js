<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>GPU.JS : Test All</title>
  <link rel="stylesheet" href="../node_modules/qunit/qunit/qunit.css">

  <script src="browser-test-utils.js"></script>
  <!-- gpu.js scripts -->
  <script src="../dist/gpu-browser.js"></script>
</head>
<body>
<div id="qunit"></div>
<div id="qunit-fixture"></div>
<script>
  const isBrowser = true;
  const browserGPU = { GPU };
  for (const p in GPU) {
    if (p === 'GPU') continue;
    browserGPU[p] = GPU[p];
  }
  window.process = {
    cwd: () => {
      return '../..';
    }
  };
  window.require = (module) => {
    if (module.match(/[.][.]\/src$/)) return browserGPU;
    if (module === 'sinon') return sinon;
    if (module === 'qunit') return QUnit;
    if (module === 'acorn') return acorn;
    if (module.match(/[.][.]\/browser-test-utils$/)) return browserTestUtils;
    throw new Error('cannot find ' + module);
  };
</script>
<script src="../node_modules/sinon/pkg/sinon.js"></script>
<script src="../node_modules/qunit/qunit/qunit.js"></script>
<script src="../node_modules/acorn/dist/acorn.js"></script>
<script>
  // Machine-readable results for automated browser runs (test/browserstack/run.js).
  // QUnit's HTML output alone is not enough: a test that fails after its own
  // testDone leaves no failing <li> behind, so failures can go unreported.
  (function () {
    const results = window.__qunitResults = {
      done: false,
      total: 0,
      passed: 0,
      failed: 0,
      skipped: 0,
      tests: []
    };
    QUnit.on('testEnd', testEnd => {
      if (testEnd.status !== 'failed') return;
      results.tests.push({
        name: testEnd.fullName.join(': '),
        status: 'fail',
        message: testEnd.errors
          .map(error => error.message || (error.stack || '').split('\n')[0] || 'failed')
          .join(' | ')
          .slice(0, 500)
      });
    });
    QUnit.on('error', error => {
      results.tests.push({
        name: 'global failure',
        status: 'fail',
        message: String((error && error.message) || error).slice(0, 500)
      });
    });
    QUnit.on('runEnd', runEnd => {
      const counts = runEnd.testCounts;
      results.total = counts.total;
      results.passed = counts.passed;
      results.failed = counts.failed;
      results.skipped = counts.skipped;
      results.done = true;
    });
  })();
</script>
{{test-files}}
</body>
</html>
